<html><head><title>text converter</title>
<style>
body{background:#111;color:#eee;font-family:monospace;padding:20px;max-width:700px;margin:auto}
textarea{width:100%;font-size:16px;font-family:monospace;padding:10px;box-sizing:border-box}
.out{background:#1c1c1c;border:1px solid #333;padding:10px;margin:8px 0;border-radius:6px;position:relative}
.out label{color:#8f8;font-size:12px;display:block;margin-bottom:4px}
.out pre{white-space:pre-wrap;word-break:break-word;margin:0}
.out button{position:absolute;top:8px;right:8px;font-size:11px;cursor:pointer}
h1{font-size:20px}
</style></head>
<body>
<h1>paste text, get it back different ways</h1>
<textarea id="inp" rows="4" placeholder="paste something here..."></textarea>
<div id="results"></div>

<script>
const inp = document.getElementById('inp')
const results = document.getElementById('results')

function titleCase(s){return s.replace(/\w\S*/g, t=>t[0].toUpperCase()+t.slice(1).toLowerCase())}
function alternatingCase(s){return s.split('').map((c,i)=>i%2==0?c.toLowerCase():c.toUpperCase()).join('')}
function reverseText(s){return s.split('').reverse().join('')}
function noVowels(s){return s.replace(/[aeiouAEIOU]/g,'')}
function spacedOut(s){return s.split('').join(' ')}
function snakeCase(s){return s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function kebabCase(s){return s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function camelCase(s){
  let words=s.trim().toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)
  return words.map((w,i)=>i==0?w:w[0].toUpperCase()+w.slice(1)).join('')
}
function rot13(s){return s.replace(/[a-zA-Z]/g,c=>{
  let base=c<='Z'?65:97
  return String.fromCharCode((c.charCodeAt(0)-base+13)%26+base)
})}
function leetSpeak(s){
  let map={a:'4',e:'3',i:'1',o:'0',s:'5',t:'7',A:'4',E:'3',I:'1',O:'0',S:'5',T:'7'}
  return s.split('').map(c=>map[c]||c).join('')
}
function mockingCase(s){
  let out='',up=false
  for(let c of s){
    if(/[a-zA-Z]/.test(c)){out+=up?c.toUpperCase():c.toLowerCase();up=!up}
    else out+=c
  }
  return out
}
function removeExtraSpaces(s){return s.trim().replace(/\s+/g,' ')}
function wordCount(s){
  let words=s.trim().split(/\s+/).filter(Boolean).length
  let chars=s.length
  let sentences=(s.match(/[.!?]+/g)||[]).length
  return `${words} words, ${chars} characters, ~${sentences} sentences`
}

const transforms=[
  ['UPPERCASE', s=>s.toUpperCase()],
  ['lowercase', s=>s.toLowerCase()],
  ['Title Case', titleCase],
  ['aLtErNaTiNg CaSe', alternatingCase],
  ['MoCkInG cAsE (spongebob)', mockingCase],
  ['reversed', reverseText],
  ['snake_case', snakeCase],
  ['kebab-case', kebabCase],
  ['camelCase', camelCase],
  ['no vowels', noVowels],
  ['s p a c e d  o u t', spacedOut],
  ['ROT13', rot13],
  ['1337sp34k', leetSpeak],
  ['cleaned (trim + single spaces)', removeExtraSpaces],
  ['stats', wordCount],
]

function copyThis(txt, btn){
  navigator.clipboard.writeText(txt).then(()=>{
    let old=btn.textContent
    btn.textContent='copied!'
    setTimeout(()=>btn.textContent=old,1000)
  }).catch(()=>{
    btn.textContent='copy failed'
    setTimeout(()=>btn.textContent='copy',1000)
  })
}

function render(){
  let text=inp.value
  results.innerHTML=''
  if(!text.trim()){return}
  transforms.forEach(([label,fn])=>{
    let out
    try{out=fn(text)}catch(e){out='(error)'}
    let div=document.createElement('div')
    div.className='out'
    let lbl=document.createElement('label')
    lbl.textContent=label
    let pre=document.createElement('pre')
    pre.textContent=out
    let btn=document.createElement('button')
    btn.textContent='copy'
    btn.addEventListener('click',()=>copyThis(out,btn))
    div.appendChild(lbl)
    div.appendChild(pre)
    div.appendChild(btn)
    results.appendChild(div)
  })
}

inp.addEventListener('input', render)
inp.addEventListener('paste', ()=>setTimeout(render,0))
inp.addEventListener('keyup', render)
</script>
</body></html>
