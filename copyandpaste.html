<script>
(function () {
  'use strict';

  const SETTINGS_KEY = 'tidypaste:settings';
  const HISTORY_KEY = 'tidypaste:history';
  const MAX_HISTORY = 15;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) =>
    Array.from(root.querySelectorAll(selector));

  const reducedMotion =
    window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;

  const DAYS = [
    'Sunday',
    'Monday',
    'Tuesday',
    'Wednesday',
    'Thursday',
    'Friday',
    'Saturday'
  ];

  const MONTHS = [
    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December'
  ];

  const RETENTION = {
    '10m': 10 * 60 * 1000,
    '1h': 60 * 60 * 1000,
    '24h': 24 * 60 * 60 * 1000
  };

  function pad(value) {
    return String(value).padStart(2, '0');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function now() {
    return new Date();
  }

  /*
   * DATE / TIME
   */

  function formatISO(date) {
    return [
      date.getFullYear(),
      pad(date.getMonth() + 1),
      pad(date.getDate())
    ].join('-');
  }

  function formatAU(date) {
    return [
      pad(date.getDate()),
      pad(date.getMonth() + 1),
      date.getFullYear()
    ].join('/');
  }

  function formatUS(date) {
    return [
      pad(date.getMonth() + 1),
      pad(date.getDate()),
      date.getFullYear()
    ].join('/');
  }

  function formatLongDate(date) {
    return `${DAYS[date.getDay()]}, ${date.getDate()} ${
      MONTHS[date.getMonth()]
    } ${date.getFullYear()}`;
  }

  function format24Hour(date) {
    return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(
      date.getSeconds()
    )}`;
  }

  function format12Hour(date) {
    let hour = date.getHours();
    const suffix = hour >= 12 ? 'PM' : 'AM';

    hour %= 12;
    if (hour === 0) hour = 12;

    return `${pad(hour)}:${pad(date.getMinutes())} ${suffix}`;
  }

  function formatTimestamp(date) {
    return `${formatISO(date)} ${format24Hour(date)}`;
  }

  /*
   * STORAGE
   */

  async function readStorage(key, fallback) {
    try {
      const result = await window.storage.get(key, false);

      if (!result?.value) {
        return fallback;
      }

      return JSON.parse(result.value);
    } catch {
      return fallback;
    }
  }

  async function writeStorage(key, value) {
    try {
      await window.storage.set(key, JSON.stringify(value), false);
      return true;
    } catch {
      return false;
    }
  }

  async function loadSettings() {
    const settings = await readStorage(SETTINGS_KEY, {});
    return settings && typeof settings === 'object' && !Array.isArray(settings)
      ? settings
      : {};
  }

  async function updateSettings(changes) {
    const settings = await loadSettings();
    const updated = { ...settings, ...changes };

    await writeStorage(SETTINGS_KEY, updated);
    return updated;
  }

  async function loadHistory() {
    const history = await readStorage(HISTORY_KEY, []);

    if (!Array.isArray(history)) {
      return [];
    }

    return history.map(item => ({
      ...item,
      ts: typeof item.ts === 'number' ? item.ts : Date.now()
    }));
  }

  function saveHistory(history) {
    return writeStorage(HISTORY_KEY, history);
  }

  /*
   * CALENDAR
   */

  const calendar = {
    today: now(),
    year: now().getFullYear(),
    month: now().getMonth(),
    selected: now()
  };

  const calendarElements = {
    monthLabel: $('#calMonthLabel'),
    grid: $('#calGrid'),
    previous: $('#calPrev'),
    next: $('#calNext')
  };

  function getMonthCells(year, month) {
    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const previousMonth = new Date(year, month, 0);
    const nextMonth = new Date(year, month + 1, 1);

    const cells = [];

    for (let i = first.getDay() - 1; i >= 0; i--) {
      cells.push({
        day: previousMonth.getDate() - i,
        month: previousMonth.getMonth(),
        year: previousMonth.getFullYear(),
        currentMonth: false
      });
    }

    for (let day = 1; day <= daysInMonth; day++) {
      cells.push({
        day,
        month,
        year,
        currentMonth: true
      });
    }

    let day = 1;

    while (cells.length % 7 !== 0) {
      cells.push({
        day: day++,
        month: nextMonth.getMonth(),
        year: nextMonth.getFullYear(),
        currentMonth: false
      });
    }

    return cells;
  }

  function changeMonth(amount) {
    const date = new Date(
      calendar.year,
      calendar.month + amount,
      1
    );

    calendar.year = date.getFullYear();
    calendar.month = date.getMonth();

    renderCalendar();
  }

  function insertAtCursor(element, text) {
    const start = element.selectionStart ?? element.value.length;
    const end = element.selectionEnd ?? element.value.length;

    element.value =
      element.value.slice(0, start) +
      text +
      element.value.slice(end);

    const position = start + text.length;

    element.selectionStart = position;
    element.selectionEnd = position;

    element.focus();
    element.dispatchEvent(new Event('input'));
  }

  function renderCalendar() {
    const { monthLabel, grid } = calendarElements;

    monthLabel.textContent =
      `${MONTHS[calendar.month]} ${calendar.year}`;

    grid.replaceChildren();

    const cells = getMonthCells(
      calendar.year,
      calendar.month
    );

    const todayValue = formatISO(now());
    const selectedValue = formatISO(calendar.selected);

    cells.forEach(cell => {
      const date = new Date(
        cell.year,
        cell.month,
        cell.day
      );

      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'cal-cell';

      if (!cell.currentMonth) {
        button.classList.add('cal-outside');
      }

      const value = formatISO(date);

      if (value === todayValue) {
        button.classList.add('cal-today');
      }

      if (value === selectedValue) {
        button.classList.add('cal-selected');
      }

      button.textContent = cell.day;
      button.setAttribute(
        'aria-label',
        formatLongDate(date)
      );

      button.addEventListener('click', () => {
        calendar.selected = date;

        if (!cell.currentMonth) {
          calendar.year = cell.year;
          calendar.month = cell.month;
        }

        renderCalendar();
        renderDateFormats();
      });

      grid.appendChild(button);
    });
  }

  /*
   * DATE / TIME INSERTER
   */

  const input = $('#input');
  const navTime = $('#navTime');
  const navDate = $('#navDate');
  const dateFormatList = $('#dateFmtList');
  const timeFormatList = $('#timeFmtList');

  function copyToClipboard(text) {
    return clipboard.copy(text);
  }

  function createFormatRow(label, value) {
    const row = document.createElement('div');

    row.className = 'fmt-row';

    row.innerHTML = `
      <div>
        <span class="fmt-label">${escapeHtml(label)}</span><br>
        <span class="fmt-value">${escapeHtml(value)}</span>
      </div>

      <div class="fmt-actions">
        <button type="button" data-action="insert">Insert</button>
        <button type="button" data-action="copy">Copy</button>
      </div>
    `;

    $('[data-action="insert"]', row).addEventListener(
      'click',
      () => insertAtCursor(input, value)
    );

    $('[data-action="copy"]', row).addEventListener(
      'click',
      () => copyToClipboard(value)
    );

    return row;
  }

  function renderDateFormats() {
    const date = calendar.selected;

    dateFormatList.replaceChildren(
      createFormatRow('ISO', formatISO(date)),
      createFormatRow('DD/MM/YYYY', formatAU(date)),
      createFormatRow('MM/DD/YYYY', formatUS(date)),
      createFormatRow('Long', formatLongDate(date))
    );
  }

  function renderTimeFormats(date) {
    timeFormatList.replaceChildren(
      createFormatRow('24-hour', format24Hour(date)),
      createFormatRow('12-hour', format12Hour(date)),
      createFormatRow('Timestamp', formatTimestamp(date))
    );
  }

  function updateClock() {
    const date = now();

    navTime.textContent = format24Hour(date);
    navDate.textContent = formatAU(date);

    renderTimeFormats(date);
  }

  calendarElements.previous.addEventListener(
    'click',
    () => changeMonth(-1)
  );

  calendarElements.next.addEventListener(
    'click',
    () => changeMonth(1)
  );

  /*
   * CLEANING
   */

  function cleanText(text, options) {
    let cleaned = text;

    const stats = {
      smartChars: 0,
      nbsp: 0,
      zeroWidth: 0,
      trailing: 0,
      blankLines: 0
    };

    if (options.quotes) {
      const matches =
        cleaned.match(/[\u201C\u201D\u2018\u2019]/g) || [];

      cleaned = cleaned
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[\u2018\u2019]/g, "'");

      stats.smartChars += matches.length;
    }

    if (options.dashes) {
      const matches =
        cleaned.match(/[\u2013\u2014]/g) || [];

      cleaned = cleaned
        .replace(/\u2014/g, '--')
        .replace(/\u2013/g, '-');

      stats.smartChars += matches.length;
    }

    if (options.nbsp) {
      stats.nbsp =
        (cleaned.match(/\u00A0/g) || []).length;

      cleaned = cleaned.replace(/\u00A0/g, ' ');
    }

    if (options.zeroWidth) {
      const pattern = /[\u200B\u200C\u200D\uFEFF]/g;

      stats.zeroWidth =
        (cleaned.match(pattern) || []).length;

      cleaned = cleaned.replace(pattern, '');
    }

    if (options.trailing) {
      let count = 0;

      cleaned = cleaned
        .split('\n')
        .map(line => {
          if (/[ \t]+$/.test(line)) {
            count++;
          }

          return line.replace(/[ \t]+$/, '');
        })
        .join('\n');

      stats.trailing = count;
    }

    if (options.blankLines) {
      stats.blankLines =
        (cleaned.match(/\n{3,}/g) || []).length;

      cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
    }

    return { cleaned, stats };
  }

  function buildMarks(text, options) {
    let html = escapeHtml(text);

    if (options.trailing) {
      html = html
        .split('\n')
        .map(line =>
          line.replace(
            /([ \t]+)$/,
            '<span class="mk mk-trail">$1</span>'
          )
        )
        .join('\n');
    }

    if (options.quotes) {
      html = html.replace(
        /[\u201C\u201D\u2018\u2019]/g,
        character =>
          `<span class="mk mk-quote">${character}</span>`
      );
    }

    if (options.dashes) {
      html = html.replace(
        /[\u2013\u2014]/g,
        character =>
          `<span class="mk mk-quote">${character}</span>`
      );
    }

    if (options.nbsp) {
      html = html.replace(
        /\u00A0/g,
        '<span class="mk mk-space">&nbsp;</span>'
      );
    }

    if (options.zeroWidth) {
      html = html.replace(
        /[\u200B\u200C\u200D\uFEFF]/g,
        '<span class="mk mk-zw">⌫</span>'
      );
    }

    return html;
  }

  function getCleaningOptions() {
    const options = {};

    $$('#toggles input[type="checkbox"]').forEach(checkbox => {
      options[checkbox.dataset.opt] = checkbox.checked;
    });

    return options;
  }

  /*
   * FORMAT DETECTION
   */

  function nonEmptyLines(text) {
    return text
      .split('\n')
      .filter(line => line.trim());
  }

  function countCharacter(line, character) {
    return (line.match(
      new RegExp(`\\${character}`, 'g')
    ) || []).length;
  }

  function hasEqualCounts(lines, counter) {
    if (!lines.length) return false;

    const firstCount = counter(lines[0]);

    return (
      firstCount > 0 &&
      lines.every(line => counter(line) === firstCount)
    );
  }

  function detectFormat(text) {
    const lines = nonEmptyLines(text);

    if (lines.length < 2) {
      return 'plain-list';
    }

    const secondLine = lines[1].trim();

    const markdownSeparator =
      /^\|?[\s:-]+\|[\s:|-]*\|?$/.test(secondLine);

    if (
      markdownSeparator &&
      secondLine.includes('-')
    ) {
      return 'markdown';
    }

    if (
      hasEqualCounts(
        lines,
        line => (line.match(/\t/g) || []).length
      )
    ) {
      return 'tsv';
    }

    if (
      hasEqualCounts(
        lines,
        line => (line.match(/,/g) || []).length
      )
    ) {
      return 'csv';
    }

    return 'plain-list';
  }

  function parseMarkdownRow(line) {
    return line
      .trim()
      .replace(/^\|/, '')
      .replace(/\|$/, '')
      .split('|')
      .map(cell => cell.trim());
  }

  function parseTable(text, format) {
    const lines = nonEmptyLines(text);

    if (format === 'tsv') {
      return lines.map(line =>
        line.split('\t').map(cell => cell.trim())
      );
    }

    if (format === 'csv') {
      return lines.map(line =>
        line.split(',').map(cell => cell.trim())
      );
    }

    if (format === 'markdown') {
      return lines
        .map(parseMarkdownRow)
        .filter(row =>
          !row.every(cell => /^:?-+:?$/.test(cell))
        );
    }

    return lines.map(line => [line.trim()]);
  }

  function csvCell(value) {
    const cell = String(value ?? '');

    return /[",\n]/.test(cell)
      ? `"${cell.replace(/"/g, '""')}"`
      : cell;
  }

  function convertToCSV(rows) {
    return rows
      .map(row => row.map(csvCell).join(','))
      .join('\n');
  }

  function convertToMarkdown(rows, hasHeader) {
    if (!rows.length) {
      return '';
    }

    const columnCount = rows[0].length;

    const header = hasHeader
      ? rows[0]
      : Array.from(
          { length: columnCount },
          (_, index) => `Column ${index + 1}`
        );

    const body = hasHeader
      ? rows.slice(1)
      : rows;

    return [
      `| ${header.join(' | ')} |`,
      `| ${header.map(() => '---').join(' | ')} |`,
      ...body.map(row => `| ${row.join(' | ')} |`)
    ].join('\n');
  }

  function convertToJSON(rows, hasHeader) {
    if (!rows.length) {
      return '[]';
    }

    if (rows[0].length === 1 && !hasHeader) {
      return JSON.stringify(
        rows.map(row => row[0]),
        null,
        2
      );
    }

    if (!hasHeader) {
      return JSON.stringify(rows, null, 2);
    }

    const header = rows[0];

    const objects = rows.slice(1).map(row => {
      const object = {};

      header.forEach((name, index) => {
        object[name || `col${index + 1}`] =
          row[index] ?? '';
      });

      return object;
    });

    return JSON.stringify(objects, null, 2);
  }

  /*
   * CLEANER UI
   */

  const cleaner = {
    cleaned: '',
    rows: [],
    format: 'plain-list',
    activeTab: 'clean',
    marksHtml: '',
    hasResult: false
  };

  const cleanerElements = {
    inputCount: $('#inCount'),
    outputCount: $('#outCount'),
    outputBox: $('#outputBox'),
    stats: $('#stats'),
    cleanButton: $('#cleanBtn'),
    copyButton: $('#copyBtn'),
    flash: $('#flash'),
    tabs: $('#tabs')
  };

  const TABLE_TABS = ['markdown', 'csv', 'json'];

  function enableTableTabs(enabled) {
    $$('#tabs [data-tab]').forEach(tab => {
      if (TABLE_TABS.includes(tab.dataset.tab)) {
        tab.disabled = !enabled;
      }
    });
  }

  function renderOutput() {
    const { outputBox, outputCount, tabs } = cleanerElements;

    $$('.tab', tabs).forEach(tab => {
      tab.classList.toggle(
        'active',
        tab.dataset.tab === cleaner.activeTab
      );
    });

    switch (cleaner.activeTab) {
      case 'clean':
        outputBox.textContent = cleaner.cleaned;
        break;

      case 'markdown':
        outputBox.textContent = cleaner.rows.length
          ? convertToMarkdown(cleaner.rows, true)
          : 'No table structure detected in this paste — try tab-separated, comma-separated, or a markdown table.';
        break;

      case 'csv':
        outputBox.textContent = cleaner.rows.length
          ? convertToCSV(cleaner.rows)
          : 'No table structure detected — paste tab/comma-separated data, or a list of items for a single-column CSV.';
        break;

      case 'json':
        outputBox.textContent = cleaner.rows.length
          ? convertToJSON(
              cleaner.rows,
              cleaner.format !== 'plain-list'
            )
          : '[]';
        break;

      case 'marks':
        outputBox.innerHTML =
          cleaner.marksHtml || 'Nothing cleaned yet.';
        break;
    }

    outputCount.textContent = cleaner.hasResult
      ? `${cleaner.cleaned.length} characters`
      : '—';
  }

  function updateStats(stats, format) {
    const {
      smartChars,
      nbsp,
      zeroWidth,
      trailing,
      blankLines
    } = stats;

    const totalFixed =
      smartChars +
      nbsp +
      zeroWidth +
      trailing +
      blankLines;

    const changes = [];

    if (smartChars) {
      changes.push(
        `${smartChars} smart character${
          smartChars === 1 ? '' : 's'
        } normalized`
      );
    }

    if (nbsp) {
      changes.push(
        `${nbsp} non-breaking space${
          nbsp === 1 ? '' : 's'
        } fixed`
      );
    }

    if (zeroWidth) {
      changes.push(
        `${zeroWidth} invisible character${
          zeroWidth === 1 ? '' : 's'
        } removed`
      );
    }

    if (trailing) {
      changes.push(
        `${trailing} line${
          trailing === 1 ? '' : 's'
        } with trailing whitespace trimmed`
      );
    }

    if (blankLines) {
      changes.push(
        `${blankLines} run${
          blankLines === 1 ? '' : 's'
        } of extra blank lines collapsed`
      );
    }

    const labels = {
      tsv: 'tab-separated table',
      csv: 'comma-separated table',
      markdown: 'markdown table',
      'plain-list': 'plain list / text'
    };

    cleanerElements.stats.style.display = 'block';

    const message = totalFixed
      ? `<strong>Fixed:</strong> ${changes.join(' · ')}`
      : '<strong>Fixed:</strong> nothing to clean — this paste was already tidy.';

    cleanerElements.stats.innerHTML =
      `${message} <span style="opacity:0.6;">· detected as ${
        labels[format]
      }</span>`;
  }

  function cleanPaste() {
    const rawText = input.value;

    if (!rawText.trim()) {
      cleanerElements.outputBox.textContent =
        'Paste something on the left first.';
      return;
    }

    const options = getCleaningOptions();
    const result = cleanText(rawText, options);
    const format = detectFormat(result.cleaned);

    cleaner.cleaned = result.cleaned;
    cleaner.rows = parseTable(result.cleaned, format);
    cleaner.format = format;
    cleaner.marksHtml = buildMarks(rawText, options);
    cleaner.hasResult = true;

    enableTableTabs(true);
    updateStats(result.stats, format);
    renderOutput();

    saveToHistory(rawText, result.cleaned);
  }

  $$('#toggles .chip').forEach(chip => {
    const checkbox = $('input', chip);

    checkbox.addEventListener('change', () => {
      chip.classList.toggle('on', checkbox.checked);
    });
  });

  input.addEventListener('input', () => {
    cleanerElements.inputCount.textContent =
      `${input.value.length} characters`;
  });

  cleanerElements.cleanButton.addEventListener(
    'click',
    cleanPaste
  );

  document.addEventListener('keydown', event => {
    if (
      (event.ctrlKey || event.metaKey) &&
      event.key === 'Enter'
    ) {
      event.preventDefault();
      cleanPaste();
    }
  });

  cleanerElements.tabs.addEventListener('click', event => {
    const tab = event.target.closest('.tab');

    if (!tab || tab.disabled) {
      return;
    }

    cleaner.activeTab = tab.dataset.tab;
    renderOutput();
  });

  /*
   * CLIPBOARD
   */

  const clipboard = {
    timer: null
  };

  const clipboardElements = {
    autoClear: $('#autoClearToggle'),
    seconds: $('#autoClearSeconds'),
    countdown: $('#clipCountdown'),
    flash: $('#flash')
  };

  function stopClipboardCountdown() {
    if (clipboard.timer !== null) {
      clearInterval(clipboard.timer);
      clipboard.timer = null;
    }

    clipboardElements.countdown.classList.remove('show');
  }

  function showClipboardMessage(message, duration) {
    clipboardElements.flash.textContent = message;
    clipboardElements.flash.classList.add('show');

    setTimeout(() => {
      clipboardElements.flash.classList.remove('show');
    }, duration);
  }

  function startClipboardCountdown(seconds) {
    stopClipboardCountdown();

    let remaining = seconds;
    const countdown = clipboardElements.countdown;

    countdown.textContent = `⏱ clears in ${remaining}s`;
    countdown.classList.add('show');

    clipboard.timer = setInterval(() => {
      remaining--;

      if (remaining <= 0) {
        clearInterval(clipboard.timer);
        clipboard.timer = null;

        navigator.clipboard
          .writeText('')
          .catch(() => {});

        countdown.textContent =
          '⏱ clipboard cleared';

        setTimeout(() => {
          countdown.classList.remove('show');
        }, 1600);

        return;
      }

      countdown.textContent =
        `⏱ clears in ${remaining}s`;
    }, 1000);
  }

  clipboard.copy = async function (text) {
    try {
      await navigator.clipboard.writeText(text);

      showClipboardMessage('✓ Copied', 1400);

      if (clipboardElements.autoClear.checked) {
        startClipboardCountdown(
          Number(clipboardElements.seconds.value)
        );
      }
    } catch {
      showClipboardMessage(
        'Copy failed — select text manually',
        1800
      );

      setTimeout(() => {
        clipboardElements.flash.textContent = '✓ Copied';
      }, 1800);
    }
  };

  cleanerElements.copyButton.addEventListener(
    'click',
    () => {
      const text =
        cleaner.activeTab === 'marks'
          ? cleaner.cleaned
          : cleanerElements.outputBox.textContent;

      copyToClipboard(text);
    }
  );

  clipboardElements.autoClear.addEventListener(
    'change',
    () => {
      updateSettings({
        autoClearEnabled:
          clipboardElements.autoClear.checked,
        autoClearSeconds:
          Number(clipboardElements.seconds.value)
      });
    }
  );

  clipboardElements.seconds.addEventListener(
    'change',
    () => {
      updateSettings({
        autoClearSeconds:
          Number(clipboardElements.seconds.value)
      });
    }
  );

  /*
   * HISTORY
   */

  const history = {
    items: [],
    query: '',
    retention: 'never'
  };

  const historyElements = {
    list: $('#historyList'),
    search: $('#historySearch'),
    retention: $('#retentionSelect'),
    clear: $('#clearHistory')
  };

  function retentionMilliseconds(value) {
    return RETENTION[value] ?? null;
  }

  function removeExpired(items, retention, timestamp = Date.now()) {
    const duration = retentionMilliseconds(retention);

    if (duration === null) {
      return items;
    }

    return items.filter(
      item => timestamp - item.ts < duration
    );
  }

  function formatRemaining(milliseconds) {
    if (milliseconds <= 0) {
      return 'expiring…';
    }

    const seconds = Math.ceil(milliseconds / 1000);

    if (seconds < 60) {
      return `${seconds}s`;
    }

    const minutes = Math.ceil(seconds / 60);

    if (minutes < 60) {
      return `${minutes}m`;
    }

    return `${Math.ceil(minutes / 60)}h`;
  }

  function searchHistory(items, query) {
    const search = query.trim().toLowerCase();

    if (!search) {
      return items;
    }

    return items.filter(item =>
      item.snippet.toLowerCase().includes(search)
    );
  }

  function highlightMatch(text, query) {
    const safeText = escapeHtml(text);
    const search = query.trim();

    if (!search) {
      return safeText;
    }

    const lowerText = text.toLowerCase();
    const lowerSearch = search.toLowerCase();
    const index = lowerText.indexOf(lowerSearch);

    if (index === -1) {
      return safeText;
    }

    const before = escapeHtml(
      text.slice(0, index)
    );

    const match = escapeHtml(
      text.slice(index, index + search.length)
    );

    const after = escapeHtml(
      text.slice(index + search.length)
    );

    return `${before}<mark>${match}</mark>${after}`;
  }

  function createHistoryRow(item, duration, timestamp) {
    const row = document.createElement('div');
    row.className = 'history-item';

    const time = formatTimestamp(new Date(item.ts));

    let expiry = '';

    if (duration !== null) {
      expiry =
        ` · expires in ${formatRemaining(
          item.ts + duration - timestamp
        )}`;
    }

    row.innerHTML = `
      <div class="snippet-wrap">
        <span class="snippet">
          ${highlightMatch(
            item.snippet || '(empty)',
            history.query
          )}
        </span>

        <span class="meta">
          ${time}${expiry}
        </span>
      </div>

      <div class="history-actions">
        <button
          class="btn btn-ghost btn-sm"
          data-action="restore">
          Restore
        </button>

        <button
          class="btn btn-ghost btn-sm"
          data-action="delete">
          Delete
        </button>
      </div>
    `;

    $('[data-action="restore"]', row).addEventListener(
      'click',
      () => {
        input.value = item.original;
        cleanerElements.inputCount.textContent =
          `${item.original.length} characters`;

        cleanPaste();

        $('#clean').scrollIntoView({
          behavior: reducedMotion ? 'auto' : 'smooth'
        });
      }
    );

    $('[data-action="delete"]', row).addEventListener(
      'click',
      async () => {
        history.items = history.items.filter(
          entry => entry.id !== item.id
        );

        await saveHistory(history.items);
        renderHistory();
      }
    );

    return row;
  }

  function renderHistory() {
    const timestamp = Date.now();
    const duration =
      retentionMilliseconds(history.retention);

    const visible = searchHistory(
      history.items,
      history.query
    );

    if (!visible.length) {
      historyElements.list.innerHTML =
        history.items.length
          ? '<p class="empty-note">No saved pastes match that search.</p>'
          : '<p class="empty-note">Nothing saved yet — your recent cleaned pastes will show up here.</p>';

      return;
    }

    historyElements.list.replaceChildren();

    visible.forEach(item => {
      historyElements.list.appendChild(
        createHistoryRow(
          item,
          duration,
          timestamp
        )
      );
    });
  }

  async function refreshHistory() {
    const loaded = await loadHistory();

    const valid = removeExpired(
      loaded,
      history.retention
    );

    history.items = valid;

    if (valid.length !== loaded.length) {
      await saveHistory(valid);
    }

    renderHistory();
  }

  async function saveToHistory(original, cleaned) {
    const items = await loadHistory();
    const timestamp = Date.now();

    items.unshift({
      id: timestamp,
      snippet: original
        .trim()
        .slice(0, 60)
        .replace(/\s+/g, ' '),
      original,
      cleaned,
      ts: timestamp
    });

    const limited = items.slice(0, MAX_HISTORY);

    await saveHistory(limited);

    history.items = limited;
    renderHistory();
  }

  historyElements.search.addEventListener(
    'input',
    () => {
      history.query =
        historyElements.search.value;

      renderHistory();
    }
  );

  historyElements.retention.addEventListener(
    'change',
    async () => {
      history.retention =
        historyElements.retention.value;

      await updateSettings({
        retention: history.retention
      });

      await refreshHistory();
    }
  );

  historyElements.clear.addEventListener(
    'click',
    async () => {
      history.items = [];

      await saveHistory([]);
      renderHistory();
    }
  );

  setInterval(() => {
    if (history.retention !== 'never') {
      refreshHistory();
    }
  }, 5000);

  /*
   * TIMER
   */

  const timer = {
    mode: 'timer',
    running: false,
    remainingMs: 5 * 60 * 1000,
    presetMs: 5 * 60 * 1000,
    elapsedMs: 0,
    lastTick: null,
    interval: null
  };

  const timerElements = {
    display: $('#timerDisplay'),
    status: $('#timerStatus'),
    presets: $('#timerPresets'),
    start: $('#timerStart'),
    pause: $('#timerPause'),
    reset: $('#timerReset'),
    modes: $$('[data-timer-mode]')
  };

  function formatClock(milliseconds) {
    const seconds = Math.max(
      0,
      Math.round(milliseconds / 1000)
    );

    const minutes = Math.floor(seconds / 60);
    const remainder = seconds % 60;

    return `${pad(minutes)}:${pad(remainder)}`;
  }

  function renderTimer() {
    timerElements.display.textContent =
      timer.mode === 'timer'
        ? formatClock(timer.remainingMs)
        : formatClock(timer.elapsedMs);
  }

  function stopTimer() {
    timer.running = false;
    timer.lastTick = null;

    if (timer.interval !== null) {
      clearInterval(timer.interval);
      timer.interval = null;
    }
  }

  function timerTick() {
    if (!timer.running) {
      return;
    }

    const currentTime = performance.now();

    if (timer.lastTick === null) {
      timer.lastTick = currentTime;
      return;
    }

    const difference =
      currentTime - timer.lastTick;

    timer.lastTick = currentTime;

    if (timer.mode === 'timer') {
      timer.remainingMs -= difference;

      if (timer.remainingMs <= 0) {
        timer.remainingMs = 0;
        stopTimer();

        timerElements.display.classList.add(
          'timer-done'
        );

        timerElements.status.textContent =
          "Time's up";
      }
    } else {
      timer.elapsedMs += difference;
    }

    renderTimer();
  }

  function startTimer() {
    if (timer.running) {
      return;
    }

    timer.running = true;
    timer.lastTick = performance.now();

    timerElements.display.classList.remove(
      'timer-done'
    );

    timerElements.status.textContent = 'Running';

    timer.interval = setInterval(
      timerTick,
      250
    );
  }

  function pauseTimer() {
    stopTimer();
    timerElements.status.textContent = 'Paused';
  }

  function resetTimer() {
    stopTimer();

    timer.remainingMs = timer.presetMs;
    timer.elapsedMs = 0;

    timerElements.display.classList.remove(
      'timer-done'
    );

    timerElements.status.textContent = 'Ready';

    renderTimer();
  }

  timerElements.start.addEventListener(
    'click',
    startTimer
  );

  timerElements.pause.addEventListener(
    'click',
    pauseTimer
  );

  timerElements.reset.addEventListener(
    'click',
    resetTimer
  );

  $$('#timerPresets [data-preset]').forEach(button => {
    button.addEventListener('click', () => {
      const minutes =
        Number(button.dataset.preset);

      timer.presetMs =
        minutes * 60 * 1000;

      resetTimer();
    });
  });

  timerElements.modes.forEach(tab => {
    tab.addEventListener('click', () => {
      timerElements.modes.forEach(other => {
        other.classList.remove('active');
      });

      tab.classList.add('active');

      timer.mode = tab.dataset.timerMode;

      timerElements.presets.style.display =
        timer.mode === 'timer'
          ? 'flex'
          : 'none';

      resetTimer();
    });
  });

  /*
   * GUIDE
   */

  const guideItems = [
    {
      q: 'What does each cleanup toggle actually fix?',
      a: 'Curly quotes and em/en dashes come from word processors and swap to plain ASCII equivalents. Non-breaking spaces and zero-width characters are invisible characters that often sneak in from web pages and can break code, search, or form fields. Trailing whitespace and stacked blank lines are leftover formatting from copy-pasted documents.'
    },
    {
      q: 'How does format detection work?',
      a: 'TidyPaste looks at your cleaned text and checks whether every line has the same number of tabs, the same number of commas, or matches a markdown table separator row. If none of those match, it treats the paste as a plain list, one item per line.'
    },
    {
      q: 'Is my pasted text sent anywhere?',
      a: 'No. Cleaning, converting, and formatting all happen locally in this tab. Nothing is uploaded. Your recent-paste history is saved to your own storage, not shared with anyone else using this tool.'
    },
    {
      q: 'What does the clipboard auto-clear timer do?',
      a: 'If you turn it on, TidyPaste overwrites your clipboard with an empty value a set number of seconds after you copy something. Handy if you ever paste something sensitive and don’t want it sitting on your clipboard indefinitely.'
    },
    {
      q: 'What happens when a saved paste "expires"?',
      a: 'If you set a retention window under History, pastes older than that window are automatically removed the next time the page checks. Set it to "Until cleared" to keep pastes until you delete them yourself.'
    }
  ];

  const accordion = $('#accordion');

  function createGuideItem(item, index) {
    const wrapper = document.createElement('div');

    wrapper.className = 'accordion-item';

    wrapper.innerHTML = `
      <button
        class="accordion-trigger"
        aria-expanded="false"
        id="acc-trigger-${index}">

        <span>
          ${escapeHtml(item.q)}
        </span>

        <svg
          class="chevron"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <div
        class="accordion-panel"
        id="acc-panel-${index}">

        <p>
          ${escapeHtml(item.a)}
        </p>
      </div>
    `;

    const trigger =
      $('.accordion-trigger', wrapper);

    const panel =
      $('.accordion-panel', wrapper);

    trigger.addEventListener('click', () => {
      const isOpen =
        wrapper.classList.contains('open');

      wrapper.classList.toggle(
        'open',
        !isOpen
      );

      trigger.setAttribute(
        'aria-expanded',
        String(!isOpen)
      );

      panel.style.maxHeight =
        isOpen
          ? '0px'
          : `${panel.scrollHeight}px`;
    });

    return wrapper;
  }

  guideItems.forEach((item, index) => {
    accordion.appendChild(
      createGuideItem(item, index)
    );
  });

  /*
   * THEME
   */

  const themeToggle = $('#themeToggle');

  function applyTheme(theme) {
    document.documentElement.dataset.theme =
      theme;

    themeToggle.setAttribute(
      'aria-pressed',
      String(theme === 'dark')
    );
  }

  async function initialiseTheme(settings) {
    let theme = settings.theme;

    if (!theme) {
      theme =
        window.matchMedia?.(
          '(prefers-color-scheme: dark)'
        ).matches
          ? 'dark'
          : 'light';
    }

    applyTheme(theme);
  }

  themeToggle.addEventListener(
    'click',
    async () => {
      const current =
        document.documentElement.dataset.theme;

      const next =
        current === 'dark'
          ? 'light'
          : 'dark';

      applyTheme(next);

      await updateSettings({
        theme: next
      });
    }
  );

  /*
   * NAVIGATION
   */

  const siteNav = $('#sitenav');
  const backToTop = $('#backToTop');

  let scrollPending = false;

  function updateScrollUI() {
    if (scrollPending) {
      return;
    }

    scrollPending = true;

    requestAnimationFrame(() => {
      const position = window.scrollY;

      siteNav.classList.toggle(
        'scrolled',
        position > 8
      );

      backToTop.classList.toggle(
        'show',
        position > 480
      );

      scrollPending = false;
    });
  }

  window.addEventListener(
    'scroll',
    updateScrollUI,
    { passive: true }
  );

  backToTop.addEventListener(
    'click',
    () => {
      window.scrollTo({
        top: 0,
        behavior: reducedMotion
          ? 'auto'
          : 'smooth'
      });
    }
  );

  const navLinks = $$('#navLinks a');

  const sections = [
    'clean',
    'toolkit',
    'guide',
    'history'
  ]
    .map(id => document.getElementById(id))
    .filter(Boolean);

  if ('IntersectionObserver' in window) {
    const observer =
      new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) {
              return;
            }

            navLinks.forEach(link => {
              link.classList.toggle(
                'active',
                link.dataset.section ===
                  entry.target.id
              );
            });
          });
        },
        {
          rootMargin:
            '-40% 0px -50% 0px',
          threshold: 0
        }
      );

    sections.forEach(section => {
      observer.observe(section);
    });
  }

  /*
   * STARTUP
   */

  async function init() {
    const settings = await loadSettings();

    await initialiseTheme(settings);

    if (settings.retention) {
      history.retention =
        settings.retention;

      historyElements.retention.value =
        settings.retention;
    }

    if (
      typeof settings.autoClearEnabled ===
      'boolean'
    ) {
      clipboardElements.autoClear.checked =
        settings.autoClearEnabled;
    }

    if (settings.autoClearSeconds) {
      clipboardElements.seconds.value =
        String(settings.autoClearSeconds);
    }

    renderCalendar();
    renderDateFormats();
    updateClock();
    renderTimer();
    renderOutput();

    timerElements.presets.style.display =
      'flex';

    await refreshHistory();
  }

  setInterval(updateClock, 1000);

  init();
})();
</script>
